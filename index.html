<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minijuego: Polimorfismo en Python</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Panel Izquierdo (70%) - Preguntas y Código -->
        <main class="work-area">
            <header class="header">
                <h2>Ejercicio <span id="question-number">1</span> de 10</h2>
                <div class="score">Puntuación: <span id="score-value">0</span></div>
            </header>
            
            <div class="question-container">
                <h3 id="question-text">Cargando pregunta...</h3>
                
                <!-- Tarjeta de Código Blanca -->
                <div id="code-card" class="code-card hidden">
                    <!-- El JS inyectará el código y los huecos (drop-zones) aquí -->
                </div>
                
                <button id="verify-btn" class="btn-primary hidden" onclick="verifyAnswer()">Verificar Respuesta</button>
            </div>

            <!-- Modal de retroalimentación -->
            <div id="feedback-modal" class="hidden">
                <h2 id="feedback-title">¡Bien hecho!</h2>
                <p id="feedback-message">Respuesta correcta.</p>
                <button id="next-btn" class="btn-primary">Continuar</button>
            </div>
            
            <!-- Pantalla final -->
            <div id="end-screen" class="hidden">
                <h2>¡Lección Completada!</h2>
                <p>Tu puntuación final es: <span id="final-score"></span>/10</p>
                <button onclick="location.reload()" class="btn-primary">Intentar de nuevo</button>
            </div>
        </main>

        <!-- Panel Derecho (30%) - Bloques de Respuesta -->
        <aside class="blocks-area">
            <div class="blocks-header">
                <h3>Bloques Disponibles</h3>
                <p>Arrastra los bloques hacia los huecos punteados.</p>
            </div>
            <div id="options-container" class="options-list">
                <!-- Los bloques se generan dinámicamente con JS -->
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
